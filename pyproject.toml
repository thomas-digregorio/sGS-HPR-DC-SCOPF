[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpu-dcopf-hpr"
version = "0.0.0"
description = "Staged reproduction of the GPU-based sGS-HPR algorithm for large-scale DC optimal power flow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research-only until a project license is selected" }
authors = [{ name = "SCOPF-GPU-RESEARCH contributors" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_dcopf_hpr"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
