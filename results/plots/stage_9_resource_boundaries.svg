<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1F2937}.title{font-size:24px;font-weight:700}.sub{font-size:18px;font-weight:700}.label{font-size:15px}.note{font-size:14px;fill:#4B5563}.grid{stroke:#D1D5DB;stroke-width:1}</style>
<text x="640" y="34" text-anchor="middle" class="title">Stage 8 fail-closed resource boundaries</text>
<text x="315" y="74" text-anchor="middle" class="sub">T16 live-availability gate</text>
<text x="960" y="74" text-anchor="middle" class="sub">T24/T32 signed-int32 CSR gate</text>
<text x="95" y="135" text-anchor="end" class="label">Projected</text>
<rect x="110" y="112" width="430" height="36" fill="#EEF2F7"/>
<rect x="110" y="112" width="386.73" height="36" fill="#E67E22"/>
<text x="506.73" y="136" class="label">94.435 GiB</text>
<text x="95" y="202" text-anchor="end" class="label">Live host 80%</text>
<rect x="110" y="179" width="430" height="36" fill="#EEF2F7"/>
<rect x="110" y="179" width="269.40" height="36" fill="#2A6FBB"/>
<text x="389.40" y="203" class="label">65.784 GiB</text>
<text x="95" y="269" text-anchor="end" class="label">Live CUDA 80%</text>
<rect x="110" y="246" width="430" height="36" fill="#EEF2F7"/>
<rect x="110" y="246" width="268.22" height="36" fill="#4B5563"/>
<text x="388.22" y="270" class="label">65.496 GiB</text>
<text x="95" y="336" text-anchor="end" class="label">Nominal pool 80%</text>
<rect x="110" y="313" width="430" height="36" fill="#EEF2F7"/>
<rect x="110" y="313" width="398.68" height="36" fill="#6B7280"/>
<text x="518.68" y="337" class="label">97.352 GiB</text>
<text x="750" y="123" text-anchor="end" class="label">T24 planning</text>
<rect x="765" y="100" width="430" height="36" fill="#EEF2F7"/>
<rect x="765" y="100" width="302.39" height="36" fill="#E67E22"/>
<text x="1077.39" y="124" class="label">2.532 billion</text>
<text x="750" y="181" text-anchor="end" class="label">T24 exact count</text>
<rect x="765" y="158" width="430" height="36" fill="#EEF2F7"/>
<rect x="765" y="158" width="245.77" height="36" fill="#2A6FBB"/>
<text x="1020.77" y="182" class="label">2.058 billion</text>
<text x="750" y="239" text-anchor="end" class="label">T32 planning</text>
<rect x="765" y="216" width="430" height="36" fill="#EEF2F7"/>
<rect x="765" y="216" width="403.21" height="36" fill="#B45309"/>
<text x="1178.21" y="240" class="label">3.376 billion</text>
<text x="750" y="297" text-anchor="end" class="label">T32 exact count</text>
<rect x="765" y="274" width="430" height="36" fill="#EEF2F7"/>
<rect x="765" y="274" width="327.73" height="36" fill="#1D4ED8"/>
<text x="1102.73" y="298" class="label">2.744 billion</text>
<text x="750" y="355" text-anchor="end" class="label">signed-int32 max</text>
<rect x="765" y="332" width="430" height="36" fill="#EEF2F7"/>
<rect x="765" y="332" width="256.50" height="36" fill="#4B5563"/>
<text x="1031.50" y="356" class="label">2.147 billion</text>
<text x="315" y="430" text-anchor="middle" class="note">94.435 GiB is below the 97.352-GiB nominal reference</text>
<text x="315" y="453" text-anchor="middle" class="note">but above both observed live budgets (65.784/65.496 GiB).</text>
<text x="960" y="430" text-anchor="middle" class="note">T24 exact count is below int32; its conservative envelope is not.</text>
<text x="960" y="453" text-anchor="middle" class="note">T32 exceeds int32 under both the exact count and envelope.</text>
<rect x="72" y="510" width="1136" height="142" rx="8" fill="#F3F4F6"/>
<text x="640" y="543" text-anchor="middle" class="sub">Scientific interpretation</text>
<text x="640" y="574" text-anchor="middle" class="label">T16 records a conservative live-availability safety decision, not a 128-GB hardware ceiling.</text>
<text x="640" y="602" text-anchor="middle" class="label">T24 records a policy-envelope block, not a demonstrated materialized-index overflow.</text>
<text x="640" y="630" text-anchor="middle" class="label">All three guards stopped before LP construction or solver allocation; none is an OOM crash.</text>
</svg>
